name: E2E Android

on:
  workflow_dispatch:
  pull_request:
    # No `synchronize`: a push to an open pull request does not rebuild. It runs once when
    # the PR opens and then only on request — add the `run-ci` label (PR sidebar, or
    # `gh pr edit N --add-label run-ci`).
    types: [opened, reopened, ready_for_review, labeled]
    paths:
      # SDK source (shared JS bridge + native): changing the bridge must run E2E.
      - 'packages/purchasely/src/**'
      - 'packages/purchasely/ios/**'
      - 'packages/purchasely/android/src/**'
      - 'packages/purchasely/android/build.gradle'
      - 'packages/*/android/build.gradle'
      - '.github/workflows/e2e-android.yml'
      - 'integration_test/**'
      - 'example/src/E2ETestRunner.tsx'
      - 'example/android/app/build.gradle'

concurrency:
  # Keyed by ref: a global group made every PR cancel the other PRs' runs.
  group: e2e-android-${{ github.ref }}
  # Cancel superseded PR runs only; a dispatched run must finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e-android:
    name: E2E Tests (Android T1-T30)
    # `labeled` fires for every label; only `run-ci` means "build this".
    if: >-
      github.event_name != 'pull_request' ||
      github.event.action != 'labeled' ||
      github.event.label.name == 'run-ci'
    # ubuntu-latest: KVM disponible pour x86_64, requis par reactivecircuit/android-emulator-runner.
    # macOS sera utilisé dans e2e-ios.yml (simulateur iOS).
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # GitHub raises no `labeled` event for a label that is already present, so the label
      # has to go before it can trigger the next run.
      #
      # Only where the token can actually write. A `pull_request` from a fork and a
      # Dependabot PR both run with a read-only token, so this DELETE would 403 and
      # `continue-on-error` would bury it. On those PRs take the label off by hand to ask
      # for another run — one click, not a dead end.
      - name: Consume the run-ci label
        if: >-
          github.event.action == 'labeled' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.user.login != 'dependabot[bot]'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X DELETE \
            "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/labels/run-ci"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: wrapper
          cache-read-only: false

      - name: Install JS dependencies
        run: yarn install --immutable

      - name: Build JS SDK
        run: yarn purchasely:prepare

      - name: Build release APK (JS always bundled in release)
        # Release builds always embed the JS bundle — no Metro bundler needed in CI.
        # ProGuard is disabled in build.gradle (enableProguardInReleaseBuilds = false).
        # -x lintVitalRelease skips lint step that false-positives on ReactActivity.
        env:
          JAVA_OPTS: "-XX:MaxHeapSize=4g"
        run: |
          cd example/android
          ./gradlew :app:assembleRelease -x lintVitalRelease
          # Verify the JS bundle is embedded
          APK="app/build/outputs/apk/release/app-release.apk"
          if unzip -l "$APK" | grep -q "index.android.bundle"; then
            echo "✅ JS bundle confirmed in APK"
          else
            echo "❌ JS bundle NOT found in APK"
            exit 1
          fi

      - name: Run E2E suite on emulator (T1-T30)
        # ReactiveCircus/android-emulator-runner handles: system-image install,
        # AVD creation, emulator start with KVM, boot wait, animations disable.
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          avd-name: rn_e2e_api34
          # The default API 34 data partition can exceed the free disk left
          # after the React Native build and make the emulator exit at launch.
          disk-size: 2048M
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot
          script: bash integration_test/run_e2e.sh emulator-5554 --skip-build

      # Screenshots and view dumps from T28/T29: on success they are the visual
      # record the tests exist to produce, so this runs either way.
      - name: Upload E2E artifacts (screenshots, view dumps)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-android-artifacts-${{ github.run_id }}
          path: integration_test/artifacts/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload logcat on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logcat-${{ github.run_id }}
          path: |
            /tmp/e2e_rn_logcat_*.log
            /tmp/e2e_rn_*.png
          retention-days: 7
