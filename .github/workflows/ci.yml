name: CI
on:
  workflow_call:
  pull_request:
    branches:
      - main
      - 'release/**'
  merge_group:
    types:
      - checks_requested

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Lint files
        run: yarn lint

      - name: Typecheck files
        run: yarn typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Run TypeScript unit tests
        run: yarn test --maxWorkers=2 --coverage

  build-android:
    runs-on: ubuntu-latest
    env:
      GRADLE_FLAGS: "--build-cache --parallel --configuration-cache --configuration-cache-problems=warn"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build library
        run: yarn prepare

      - name: Install JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: wrapper
          cache-read-only: false

      - name: Cache Android build cache
        uses: actions/cache@v4
        with:
          path: ~/.android/build-cache
          key: android-build-cache-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/gradle/libs.versions.toml', '**/settings.gradle*') }}
          restore-keys: |
            android-build-cache-${{ runner.os }}-

      - name: Build example for Android
        env:
          JAVA_OPTS: "-XX:MaxHeapSize=6g"
        run: |
          cd example/android
          ./gradlew :app:assembleDebug $GRADLE_FLAGS

  build-ios:
    # Pinned, do not move to macos-latest. This is the 5.x maintenance line:
    # it ships React Native 0.79.2, whose bundled fmt does not compile under
    # the Xcode 26 clang that macos-latest now carries ("call to consteval
    # function ... is not a constant expression" in fmt/format-inl.h).
    # macos-15 defaults to Xcode 16.4, the toolchain 5.x was released on.
    # Drop the pin when this branch is retired, not before.
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build library
        run: yarn prepare

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            example/ios/Pods
            ~/.cocoapods
            ~/Library/Caches/CocoaPods
          key: ${{ runner.os }}-15-cocoapods-${{ hashFiles('example/ios/Podfile', 'packages/purchasely/react-native-purchasely.podspec') }}
          restore-keys: |
            ${{ runner.os }}-15-cocoapods-

      - name: Cache Xcode DerivedData
        uses: actions/cache@v4
        with:
          path: example/ios/DerivedData
          key: ${{ runner.os }}-15-derived-data-${{ hashFiles('example/ios/Podfile', 'packages/purchasely/react-native-purchasely.podspec', 'example/ios/*.xcodeproj/project.pbxproj') }}
          restore-keys: |
            ${{ runner.os }}-15-derived-data-

      - name: Install CocoaPods
        run: |
          cd example/ios
          pod install --repo-update
        env:
          NO_FLIPPER: 1

      - name: Prebuild CocoaPods targets
        run: |
          xcodebuild \
            -workspace example/ios/example.xcworkspace \
            -scheme Pods-example \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath example/ios/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build example for iOS
        run: |
          xcodebuild \
            -workspace example/ios/example.xcworkspace \
            -scheme example \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath example/ios/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build
