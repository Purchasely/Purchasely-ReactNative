name: CI
on:
  workflow_call:
  workflow_dispatch:
  # A cache written during a `pull_request` run is scoped to that PR's ref and
  # is unreadable from any other branch; only the default branch's scope is
  # shared. Without this trigger no run ever writes there, so every PR
  # reinstalled its pods and node_modules from cold. One run per merge seeds
  # the caches that every later PR restores.
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      # maintenance branches for older majors (release/5.x, ...). Without this
      # a PR targeting one gets zero checks and stays mergeable unverified.
      - 'release/**'
  merge_group:
    types:
      - checks_requested

# A force-push to a PR used to leave the previous run alive: 8 jobs, two of
# them on macOS runners. e2e-android.yml and e2e-ios.yml already do this.
concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded PR runs only. A `push: main` run must finish -- it is the
  # one that seeds the shared cache scope -- and a merge_group or release run
  # must never be cancelled either.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Lint files
        run: yarn lint

      - name: Typecheck files
        run: yarn typecheck

      - name: Build library
        run: yarn purchasely:prepare

      - name: Typecheck example app
        run: yarn workspace example typecheck

      - name: Lint example app
        run: yarn workspace example lint

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Run TypeScript unit tests
        run: yarn test --maxWorkers=2 --coverage

  build-android:
    runs-on: ubuntu-latest
    env:
      GRADLE_FLAGS: "--build-cache --parallel --configuration-cache --configuration-cache-problems=warn"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build library
        run: yarn prepare

      - name: Install JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: wrapper
          cache-read-only: false

      - name: Cache Android build cache
        uses: actions/cache@v4
        with:
          path: ~/.android/build-cache
          key: android-build-cache-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/gradle/libs.versions.toml', '**/settings.gradle*') }}
          restore-keys: |
            android-build-cache-${{ runner.os }}-

      - name: Build example for Android
        env:
          JAVA_OPTS: "-XX:MaxHeapSize=6g"
        run: |
          cd example/android
          ./gradlew :app:assembleDebug $GRADLE_FLAGS

      - name: Run Purchasely Android native unit tests
        env:
          JAVA_OPTS: "-XX:MaxHeapSize=4g"
        run: |
          cd example/android
          ./gradlew :react-native-purchasely:testDebugUnitTest

  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build library
        run: yarn prepare

      # Only the content-addressed CocoaPods download caches are cached here.
      # `example/ios/Pods` (the *generated* install tree) is deliberately NOT
      # cached: a restore-key hit could hand a stale tree to `pod install`,
      # which does not fully reconcile it, and the example app then compiled
      # against stale React Native headers while linking the current prebuilt
      # React.xcframework -- surfacing as missing `facebook::react::*` vtables
      # in libRNScreens.a at link time.
      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ~/.cocoapods
            ~/Library/Caches/CocoaPods
          key: ${{ runner.os }}-cocoapods-${{ hashFiles('example/ios/Podfile', 'packages/purchasely/react-native-purchasely.podspec', 'yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-cocoapods-

      # ccache must exist BEFORE `pod install`: the Podfile's :ccache_enabled hook
      # probes `command -v ccache` at install time and silently no-ops when it is
      # missing. CCACHE_BINARY goes into GITHUB_ENV, not a hardcoded path, because
      # React Native's ccache-clang.sh wrapper reads it from the *process*
      # environment -- the build setting RN writes is invisible to the compiler, so
      # without this every compile silently bypasses ccache (0 reads, 0 writes,
      # build still green).
      - name: Configure ccache
        id: ccache
        run: |
          set -euo pipefail
          command -v ccache >/dev/null || brew install ccache
          echo "CCACHE_BINARY=$(command -v ccache)" >> "$GITHUB_ENV"
          # Bounds what this job uploads. The measured footprint for this build is
          # ~110 MB; the 5 GB default would be a liability on a 10 GB repo quota.
          echo "CCACHE_MAXSIZE=500M" >> "$GITHUB_ENV"
          # Keys the cache: ccache's default compiler_check is `mtime`, so a runner
          # image that ships a new Xcode invalidates every entry. Without the
          # version in the key we would carry a permanently-missing cache.
          echo "xcode=$(xcodebuild -version | head -1 | tr ' ' '-')" >> "$GITHUB_OUTPUT"

      # Unlike the DerivedData cache this replaces, a PARTIAL hit is safe here:
      # ccache is content-addressed, so a stale entry can only be unused, never
      # wrong. Hence the restore-keys fallback.
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/ccache
          key: ${{ runner.os }}-ccache-${{ steps.ccache.outputs.xcode }}-${{ hashFiles('example/ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-ccache-${{ steps.ccache.outputs.xcode }}-

      # No DerivedData cache. It used to be cached here, exact-key, but it never
      # hit: until the `push: main` trigger above, no run wrote to the shared
      # cache scope. Measured once it did hit (runs 33867614845 cold ->
      # 33868869757 warm, same commit): `Prebuild CocoaPods targets` 231 s ->
      # 202 s and the XCTest job 180 s -> 178 s, i.e. run-to-run variance and
      # no reuse. `pod install` regenerates the Pods project on every run, so
      # Xcode discards the restored objects and rebuilds regardless. 222 MB of
      # a repository cache quota that is already at its cap, for nothing.
      - name: Install CocoaPods
        run: |
          cd example/ios
          pod install --repo-update
        env:
          NO_FLIPPER: 1

      - name: Prebuild CocoaPods targets
        run: |
          ccache -z
          xcodebuild \
            -workspace example/ios/example.xcworkspace \
            -scheme Pods-example \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath example/ios/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build example for iOS
        run: |
          xcodebuild \
            -workspace example/ios/example.xcworkspace \
            -scheme example \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath example/ios/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

  # Regression guard for the client-reported build failure fixed by b99a2d1:
  # under `use_frameworks!`, the pod's generated Swift header lands in
  # `react_native_purchasely.framework/Headers/` instead of `DerivedSources/`,
  # so the quoted `#import "react_native_purchasely-Swift.h"` in PurchaselyRN.m
  # was not found. Every other iOS job installs pods WITHOUT `use_frameworks!`,
  # so none of them compiles that layout.
  #
  # Only the `react-native-purchasely` pod scheme is built: the discriminating
  # unit is whether PurchaselyRN.m compiles inside a framework-layout target.
  # Building the whole example app under `use_frameworks!` would add unrelated
  # pod failure surface to a header-resolution check.
  #
  # `static` linkage only. The reporter saw `:linkage => :static` and `:dynamic`
  # fail on the very same header path, and both put the header in the framework
  # bundle, so the second linkage costs a macOS runner and proves nothing new.
  build-ios-frameworks:
    name: iOS Build (use_frameworks!)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build library
        run: yarn prepare

      # Download caches only (content-addressed, shared with the other iOS
      # jobs). The generated `Pods` tree is never cached -- see build-ios.
      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ~/.cocoapods
            ~/Library/Caches/CocoaPods
          key: ${{ runner.os }}-cocoapods-${{ hashFiles('example/ios/Podfile', 'packages/purchasely/react-native-purchasely.podspec', 'yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-cocoapods-

      # No DerivedData cache: its key in the other iOS jobs hashes the same
      # files, so both layouts would share one entry and hand each other object
      # files built for the wrong linkage.
      - name: Install CocoaPods with use_frameworks!
        run: |
          cd example/ios
          pod install --repo-update
        env:
          NO_FLIPPER: 1
          # Read by example/ios/Podfile -> use_frameworks! :linkage => :static
          USE_FRAMEWORKS: static

      - name: Build the react-native-purchasely pod under use_frameworks!
        run: |
          xcodebuild \
            -workspace example/ios/example.xcworkspace \
            -scheme react-native-purchasely \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath example/ios/DerivedDataFrameworks \
            CODE_SIGNING_ALLOWED=NO \
            build

      # A ccache that is wired up wrong fails OPEN: the build succeeds and is
      # merely slow. This step is the only signal, so it runs even on failure.
      - name: Report ccache statistics
        if: always()
        run: ccache -s

  ios-unit-tests:
    name: iOS Unit Tests (bridge)
    runs-on: macos-latest
    # Safety net: fail fast rather than burn the job's full timeout if the
    # simulator boot or test run ever stalls.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build library
        run: yarn prepare

      # See the note in build-ios: only the content-addressed download caches
      # are cached, never the generated `example/ios/Pods` tree.
      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ~/.cocoapods
            ~/Library/Caches/CocoaPods
          key: ${{ runner.os }}-cocoapods-${{ hashFiles('example/ios/Podfile', 'packages/purchasely/react-native-purchasely.podspec', 'yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-cocoapods-

      - name: Install CocoaPods
        run: |
          cd example/ios
          pod install --repo-update
        env:
          NO_FLIPPER: 1

      - name: Boot iOS Simulator
        id: boot-sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import sys, json
          d = json.load(sys.stdin)['devices']
          cands = [v for k, vs in d.items() if 'iOS' in k for v in vs if 'iPhone' in v['name']]
          pref = [c for c in cands if any(n in c['name'] for n in ('iPhone 16', 'iPhone 15'))]
          chosen = (pref or cands)[-1]
          print(chosen['udid'])
          ")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b

      # `react-native-purchasely-Unit-Tests` is the CocoaPods test_spec target
      # generated by the pod's `test_spec 'Tests'` (react-native-purchasely.podspec)
      # once `example/ios` depends on it with `:testspecs => ['Tests']` (see
      # example/ios/Podfile). It is a hostless XCTest logic-test bundle — it does
      # NOT launch the example app — so it runs the bridge's PurchaselyRNTests.m /
      # PurchaselyViewTests.swift standalone. Verified locally: `xcodebuild test
      # -workspace example.xcworkspace -scheme react-native-purchasely-Unit-Tests`
      # succeeds in isolation (all cases pass in < 1 s, no app launch).
      - name: Run react-native-purchasely bridge XCTest suite
        run: |
          cd example/ios
          set -o pipefail
          xcodebuild test \
            -workspace example.xcworkspace \
            -scheme react-native-purchasely-Unit-Tests \
            -destination "id=${{ steps.boot-sim.outputs.udid }}" \
            -resultBundlePath TestResults.xcresult \
            | tail -200

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-unit-tests-${{ github.run_id }}
          path: example/ios/TestResults.xcresult
          retention-days: 7

  build-rn-0-86-android:
    runs-on: ubuntu-latest
    env:
      GRADLE_FLAGS: "--build-cache --parallel --configuration-cache --configuration-cache-problems=warn"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build local v6 packages
        run: yarn all:prepare

      # `npm ci` in this project took 416 s, uncached: it is outside the yarn
      # workspace, so the `Setup` action's node_modules cache does not cover
      # it. Caching it is safe because the three local packages are RELATIVE
      # SYMLINKS into ../../packages (verified: node_modules/react-native-purchasely
      # -> ../../../packages/purchasely), so a restored tree still points at
      # this checkout's freshly built packages, never at a stale copy. Only
      # third-party dependencies are cached, and they move only with the
      # lockfile that keys this entry.
      - name: Restore RN 0.86 test project dependencies
        id: rn086-node-modules
        uses: actions/cache@v4
        with:
          path: test-projects/rn-purchasely-test/node_modules
          key: ${{ runner.os }}-rn086-node-modules-${{ hashFiles('test-projects/rn-purchasely-test/package-lock.json') }}

      - name: Install RN 0.86 test project dependencies
        if: steps.rn086-node-modules.outputs.cache-hit != 'true'
        working-directory: test-projects/rn-purchasely-test
        run: npm ci --ignore-scripts

      - name: Install JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Install Android SDK build requirements
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0" "ndk;27.1.12297006"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: wrapper
          cache-read-only: false

      - name: Cache Android build cache
        uses: actions/cache@v4
        with:
          path: ~/.android/build-cache
          key: android-build-cache-${{ runner.os }}-rn086-${{ hashFiles('test-projects/rn-purchasely-test/android/**/*.gradle*', 'test-projects/rn-purchasely-test/android/**/gradle-wrapper.properties') }}
          restore-keys: |
            android-build-cache-${{ runner.os }}-rn086-

      - name: Build RN 0.86 test project for Android
        working-directory: test-projects/rn-purchasely-test/android
        run: ./gradlew :app:assembleDebug $GRADLE_FLAGS

  build-rn-0-86-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build local v6 packages
        run: yarn all:prepare

      # `npm ci` in this project took 416 s, uncached: it is outside the yarn
      # workspace, so the `Setup` action's node_modules cache does not cover
      # it. Caching it is safe because the three local packages are RELATIVE
      # SYMLINKS into ../../packages (verified: node_modules/react-native-purchasely
      # -> ../../../packages/purchasely), so a restored tree still points at
      # this checkout's freshly built packages, never at a stale copy. Only
      # third-party dependencies are cached, and they move only with the
      # lockfile that keys this entry.
      - name: Restore RN 0.86 test project dependencies
        id: rn086-node-modules
        uses: actions/cache@v4
        with:
          path: test-projects/rn-purchasely-test/node_modules
          key: ${{ runner.os }}-rn086-node-modules-${{ hashFiles('test-projects/rn-purchasely-test/package-lock.json') }}

      - name: Install RN 0.86 test project dependencies
        if: steps.rn086-node-modules.outputs.cache-hit != 'true'
        working-directory: test-projects/rn-purchasely-test
        run: npm ci --ignore-scripts

      - name: Install CocoaPods dependencies
        working-directory: test-projects/rn-purchasely-test/ios
        run: pod install --repo-update

      - name: Build RN 0.86 test project for iOS
        working-directory: test-projects/rn-purchasely-test/ios
        run: |
          xcodebuild \
            -workspace RNPurchaselyTest.xcworkspace \
            -scheme RNPurchaselyTest \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build
