name: E2E iOS

on:
  workflow_dispatch:
  schedule:
    # 5h30 Paris (heure d'été) chaque nuit = 3h30 UTC (décalé de l'E2E Android à 5h00)
    - cron: '30 3 * * *'
  push:
    branches:
      - feat/sdk-v6-migration
    paths:
      # SDK source (shared JS bridge + native): changing the bridge must run E2E.
      - 'packages/purchasely/src/**'
      - 'packages/purchasely/ios/**'
      - 'packages/purchasely/android/src/**'
      - 'packages/purchasely/react-native-purchasely.podspec'
      - '.github/workflows/e2e-ios.yml'
      - 'integration_test/**'
      - 'example/src/E2ETestRunner.tsx'
      - 'example/ios/**'
  pull_request:
    paths:
      # SDK source (shared JS bridge + native): changing the bridge must run E2E.
      - 'packages/purchasely/src/**'
      - 'packages/purchasely/ios/**'
      - 'packages/purchasely/android/src/**'
      - 'packages/purchasely/react-native-purchasely.podspec'
      - '.github/workflows/e2e-ios.yml'
      - 'integration_test/**'
      - 'example/src/E2ETestRunner.tsx'
      - 'example/ios/**'

concurrency:
  group: e2e-ios
  cancel-in-progress: true

jobs:
  e2e-ios:
    name: E2E Tests (iOS T1-T29)
    # macOS requis : simulateur iOS + xcodebuild. Pas de HVF nécessaire (le
    # simulateur iOS ne virtualise pas un OS invité, contrairement à l'émulateur
    # Android ARM — c'est pourquoi Android tourne sur ubuntu + KVM).
    # macos-15 : Xcode 16.x par défaut (RN 0.86 exige Xcode >= 16.1).
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest Xcode 16 (RN 0.86 requires >= 16.1)
        run: |
          LATEST=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$LATEST" ]; then sudo xcode-select -s "$LATEST/Contents/Developer"; fi
          xcodebuild -version

      - name: Setup (Node + Yarn)
        uses: ./.github/actions/setup

      - name: Build JS SDK
        run: yarn prepare

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            example/ios/Pods
            ~/.cocoapods
            ~/Library/Caches/CocoaPods
          key: ${{ runner.os }}-cocoapods-${{ hashFiles('example/ios/Podfile.lock', 'packages/purchasely/react-native-purchasely.podspec') }}
          restore-keys: |
            ${{ runner.os }}-cocoapods-

      - name: Install CocoaPods
        run: |
          cd example/ios
          pod install --repo-update
        env:
          NO_FLIPPER: 1

      - name: Install idb (companion + client)
        run: |
          # idb_companion : tap Facebook (nécessite brew trust sur les brew récents).
          brew tap facebook/fb
          brew trust facebook/fb || true

          # idb-companion se compile depuis les sources et exige un Xcode COMPLET
          # au moins aussi récent que celui que la formule déclare (26.0 à ce
          # jour). Le job sélectionne volontairement Xcode 16.x pour builder l'app
          # (RN 0.86), et brew refusait donc l'installation :
          #   "A full installation of Xcode.app 26.0 is required to compile this
          #    software" → l'étape échouait avant même de builder quoi que ce soit,
          # ce qui laissait ce workflow rouge toutes les nuits.
          #
          # On sélectionne donc le Xcode le plus récent disponible le temps du
          # `brew install`, puis on restaure celui du job. Les deux besoins sont
          # indépendants : compiler idb-companion, et compiler l'app.
          ORIGINAL_XCODE=$(xcode-select -p)
          NEWEST_XCODE=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$NEWEST_XCODE" ] && [ "$NEWEST_XCODE/Contents/Developer" != "$ORIGINAL_XCODE" ]; then
            echo "Selecting $NEWEST_XCODE to build idb-companion"
            sudo xcode-select -s "$NEWEST_XCODE/Contents/Developer"
          fi

          # `|| true` : on restaure la sélection Xcode AVANT de décider de l'échec,
          # sinon un `set -e` laisserait le runner sur le mauvais Xcode pour le
          # build de l'app.
          brew install idb-companion || IDB_COMPANION_FAILED=1

          sudo xcode-select -s "$ORIGINAL_XCODE"
          echo "Restored Xcode: $(xcodebuild -version | head -1)"

          if [ -n "${IDB_COMPANION_FAILED:-}" ]; then
            echo "::error::brew install idb-companion failed. Newest Xcode on this runner: ${NEWEST_XCODE:-none}. The formula needs a full Xcode at least as recent as the one it declares — this image may need bumping."
            exit 1
          fi
          # fb-idb (client Python) ne supporte pas Python 3.14 (asyncio.get_event_loop
          # y lève) — on l'isole dans un venv 3.11/3.12/3.13 déterministe et on
          # exporte le binaire via $IDB (lu par les drivers tap/swipe).
          PY=$(command -v python3.12 || command -v python3.11 || command -v python3.13 || command -v python3)
          "$PY" -m venv "$RUNNER_TEMP/idbvenv"
          "$RUNNER_TEMP/idbvenv/bin/pip" install -q --upgrade pip fb-idb
          echo "IDB=$RUNNER_TEMP/idbvenv/bin/idb" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/idbvenv/bin/idb" --help >/dev/null && echo "✅ idb client OK"

      - name: Boot iOS simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import sys, json
          d = json.load(sys.stdin)['devices']
          cands = [v for k, vs in d.items() if 'iOS' in k for v in vs if 'iPhone' in v['name']]
          # iPhone 15/16 de préférence, sinon le dernier iPhone disponible
          pref = [c for c in cands if any(n in c['name'] for n in ('iPhone 16', 'iPhone 15'))]
          chosen = (pref or cands)[-1]
          print(chosen['udid'])
          ")
          echo "Booting simulator $UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          echo "IOS_SIMULATOR_UDID=$UDID" >> "$GITHUB_ENV"

      - name: Run E2E suite on simulator (build Release + T1-T29)
        run: bash integration_test/run_e2e_ios.sh "$IOS_SIMULATOR_UDID"

      # Screenshots and accessibility dumps from T28/T29: on success they are the
      # visual record the tests exist to produce, so this runs either way.
      - name: Upload E2E artifacts (screenshots, view dumps)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-ios-artifacts-${{ github.run_id }}
          path: integration_test/artifacts/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-e2e-logs-${{ github.run_id }}
          path: /tmp/e2e_rn_ios_*.log
          retention-days: 7
